<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#0a0a0a; --ink-soft:#1f242b; --paper:#eef0f2; --accent:#8a0d1f;
    --rule:#c4ccd4; --muted:#5c6773;
    --serif:'Fraunces',serif; --sans:'Inter Tight',sans-serif; --mono:'JetBrains Mono',monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { overflow:hidden; background:#fff; }
  .card {
    width:1200px; height:630px; position:relative; overflow:hidden;
    background:var(--paper);
    background-image:radial-gradient(circle at 1px 1px, rgba(10,10,10,0.06) 1px, transparent 0);
    background-size:24px 24px;
    padding:64px 72px; display:flex; flex-direction:column; justify-content:space-between;
    font-family:var(--serif); color:var(--ink);
  }
  .brand { display:flex; align-items:center; gap:16px; }
  .brand svg { width:40px; height:40px; }
  .brand-mark { font-family:var(--serif); font-weight:600; font-size:32px; font-style:italic; letter-spacing:-0.02em; line-height:1; }
  .brand-mark span { color:var(--accent); }
  .brand-tag { font-family:var(--mono); font-size:13px; text-transform:uppercase; letter-spacing:0.2em; color:var(--muted); border-left:1px solid var(--rule); padding-left:18px; }
  h1 { font-family:var(--serif); font-weight:400; font-size:78px; line-height:1.02; letter-spacing:-0.035em; max-width:900px; }
  h1 em { font-style:italic; color:var(--accent); }
  .foot { display:flex; align-items:baseline; justify-content:space-between; border-top:1px solid var(--rule); padding-top:22px; }
  .url { font-family:var(--mono); font-size:17px; letter-spacing:0.08em; color:var(--ink-soft); }
  .lab { font-family:var(--sans); font-size:16px; color:var(--muted); }
  .art { position:absolute; top:52px; right:-30px; width:250px; opacity:0.13; }
</style>
</head>
<body>
<div class="card">
  <svg class="art" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <g stroke="#0a0a0a" stroke-width="0.6" fill="none"><rect x="2" y="2" width="196" height="196"/></g>
    <g fill="#0a0a0a" font-family="JetBrains Mono, monospace" font-size="10">
      <text x="20" y="30">0.21</text><text x="80" y="30">1.04</text><text x="160" y="30">0.0</text>
      <text x="60" y="60">3.12</text><text x="160" y="60">2.7</text>
      <text x="20" y="90">0.0</text><text x="100" y="90">0.8</text>
      <text x="140" y="120">4.5</text>
      <text x="20" y="150">1.7</text><text x="170" y="150">0.9</text>
      <text x="60" y="180">0.3</text>
    </g>
  </svg>

  <div class="brand">
    <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#0a0a0a" stroke-width="2.4" fill="none">
        <rect x="4" y="4" width="18" height="18"/><rect x="26" y="4" width="18" height="18"/><rect x="48" y="4" width="18" height="18"/>
        <rect x="4" y="26" width="18" height="18"/><rect x="48" y="26" width="18" height="18"/>
        <rect x="4" y="48" width="18" height="18"/><rect x="26" y="48" width="18" height="18"/><rect x="48" y="48" width="18" height="18"/>
      </g>
      <rect x="26" y="26" width="18" height="18" fill="#8a0d1f"/>
    </svg>
    <div class="brand-mark">SmartSolve<span>AI</span></div>
    <div class="brand-tag">CSAIL · MIT</div>
  </div>

  <h1><em>AI-Guided</em> Algorithm Discovery<br>for <em>Fast</em> Linear Algebra.</h1>

  <div class="foot">
    <div class="url">smartsolveai.mit.edu</div>
    <div class="lab">MIT Julia Lab · CSAIL</div>
  </div>
</div>
</body>
</html>
